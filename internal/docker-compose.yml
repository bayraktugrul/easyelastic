version: '3'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - http.cors.enabled=true
      - http.cors.allow-origin="/.*/"
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch-secure:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch-secure
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      # Default built-in superuser
      # username: elastic
      # password: elastic123
      - ELASTIC_PASSWORD=elastic123
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=secure-cluster
      - bootstrap.memory_lock=true
      - http.cors.enabled=true
      - http.cors.allow-origin="/.*/"
      - http.cors.allow-credentials=true
      - http.cors.allow-methods="OPTIONS, HEAD, GET, POST, PUT, DELETE"
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch-secure-data:/usr/share/elasticsearch/data
    networks:
      - elastic

  sample-data-loader:
    image: curlimages/curl:latest
    container_name: sample-data-loader
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    volumes:
      - ./sample-data:/scripts
    command: >
      sh -c "
        echo 'Waiting for Elasticsearch to be ready...' &&
        sleep 10 &&
        echo 'Creating sample index with mapping...' &&
        curl -X PUT 'elasticsearch:9200/sample-products' -H 'Content-Type: application/json' -d '{
          \"mappings\": {
            \"properties\": {
              \"name\": { \"type\": \"text\", \"analyzer\": \"standard\" },
              \"description\": { \"type\": \"text\", \"analyzer\": \"standard\" },
              \"category\": { \"type\": \"keyword\" },
              \"price\": { \"type\": \"float\" },
              \"stock\": { \"type\": \"integer\" },
              \"brand\": { \"type\": \"keyword\" },
              \"rating\": { \"type\": \"float\" },
              \"created_date\": { \"type\": \"date\" },
              \"tags\": { \"type\": \"keyword\" },
              \"is_active\": { \"type\": \"boolean\" }
            }
          }
        }' &&
        echo 'Index created successfully' &&
        /scripts/load-sample-data.sh
      "

volumes:
  elasticsearch-data:
  elasticsearch-secure-data:

networks:
  elastic: